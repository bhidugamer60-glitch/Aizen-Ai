name: Build Aizen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aizen
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Configure Android SDK license
        run: |
          echo "" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Check Buildozer
        run: |
          buildozer --version

      - name: Clean old Android build files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Download Android SDK, Build Tools, NDK and p4a
        run: |
          buildozer android p4a -- --help

      - name: Verify Android Build Tools
        run: |
          echo "Checking Android SDK..."
          find "$HOME/.buildozer/android/platform/android-sdk/build-tools" \
            -maxdepth 2 \
            -type f \
            -name aidl \
            -print

      - name: Build Aizen APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aizen-APK
          path: bin/*.apk
          if-no-files-found: error
